<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <!-- Magenta glow -->
    <filter id="magGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="blurMag"/>
      <feMerge>
        <feMergeNode in="blurMag"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Cyan glow -->
    <filter id="cynGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="blurCyn"/>
      <feMerge>
        <feMergeNode in="blurCyn"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Top cube (magenta) -->
  <rect x="30" y="15" width="40" height="40"
        fill="none" stroke="#FF00FF" stroke-width="4"
        filter="url(#magGlow)" />

  <!-- Bottom cube (cyan) -->
  <rect x="30" y="45" width="40" height="40"
        fill="none" stroke="#00FFFF" stroke-width="4"
        filter="url(#cynGlow)" />

  <!-- Stylised drill bit (dark silhouette) -->
  <path d="
        M50 5
        L44 15 L56 15
        L50 25 L44 35 L56 35
        L50 45 L44 55 L56 55
        L50 65 L44 75 L56 75
        L50 85
        "
        fill="#111111" stroke="#111111" stroke-linejoin="round" stroke-linecap="round" stroke-width="2"/>
</svg>